name: Algogrind Publish

# [ALGOGRIND] Publishes every workspace package to npm under the @algogrind
# scope (restricted access). The rename + exports rewrite happens ephemerally
# in the CI workspace via scripts/prepare-publish.mjs — nothing is committed
# back to the branch.
#
# Requirements:
#   - NPM_TOKEN repository secret: npm automation token with publish rights
#     to the @algogrind org.
#
# Versioning: the workflow bumps every package version ephemerally before
# publishing. With the `version` input empty it queries npm for the latest
# published @algogrind/affine version and bumps its patch number; pass an
# explicit version (e.g. 0.28.0) for minor/major releases.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Publikálandó verzió (üresen hagyva: az npm-en lévő legutóbbi verzió patch-bumpja)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check NPM_TOKEN secret
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::Az NPM_TOKEN repository secret nincs beallitva (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (yarn 4)
        run: corepack enable

      - name: Rename packages to @algogrind scope
        run: node scripts/prepare-publish.mjs

      - name: Bump package versions
        run: node scripts/bump-version.mjs "${{ inputs.version }}"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: yarn install --mode update-lockfile && yarn install
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false
          HUSKY: 0

      - name: Build packages
        run: yarn build:packages

      - name: Rewrite exports to dist
        run: node scripts/finalize-publish.mjs

      - name: Publish to npm
        run: yarn publish:algogrind
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
